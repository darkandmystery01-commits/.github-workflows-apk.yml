name: Build APK fixed
on:
  workflow_dispatch:
  push:
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q screen-editor-android.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - run: gradle assembleDebug --no-daemon
        working-directory: screen-editor-android
      - uses: actions/upload-artifact@v4
        with:
          name: screen-editor-agent-apk
          path: screen-editor-android/app/build/outputs/apk/debug/app-debug.apk
